version: '3'

vars:
  PLATFORM: windows
  ARCH: x86_64
  GODOT_OUTPUT_DIR: ./bin
  USER:
    sh: cmd.exe /c echo %USERNAME%

  # scons build options
  USE_D3D12: "yes"
  MODULE_MONO_ENABLED: "yes"
  DEV_BUILD: "yes"
  COMPILEDB: "yes"

tasks:
  zed:generate-tasks:
    desc: "Sync Zed Taskfile.yml to tasks.json"
    platforms: [windows]
    cmds:
      - wsl taskfile-to-tasks --task-cmd 'task'

  rebuild:
    desc: "Clean and build everything"
    cmds:
      - task: clean:all
      - task: build:all

  build:all:
    desc: "Build editor and all export templates with .NET support"
    cmds:
      - task: build:editor-dotnet

  setup:d3d12:
    desc: "Install DirectX 12 SDK using Godot script"
    if: '[ "{{.USE_D3D12}}" == "yes" ]'
    cmds:
      - python misc/scripts/install_d3d12_sdk_windows.py

  build:editor:
    desc: "Build Godot editor binary with .NET support (Windows x86_64)"
    cmds:
      - scons platform={{.PLATFORM}} target=editor arch={{.ARCH}} module_mono_enabled={{.MODULE_MONO_ENABLED}} d3d12={{.USE_D3D12}} dev_build={{.DEV_BUILD}} compiledb={{.COMPILEDB}}
    deps:
      - setup:d3d12

  build:template-debug:
    desc: "Build Godot debug export template with .NET support (Windows x86_64)"
    cmds:
      - scons platform={{.PLATFORM}} target=template_debug arch={{.ARCH}} module_mono_enabled={{.MODULE_MONO_ENABLED}} d3d12={{.USE_D3D12}} dev_build={{.DEV_BUILD}} compiledb={{.COMPILEDB}}

  build:template-release:
    desc: "Build Godot release export template with .NET support (Windows x86_64)"
    cmds:
      - scons platform={{.PLATFORM}} target=template_release arch={{.ARCH}} module_mono_enabled={{.MODULE_MONO_ENABLED}} d3d12={{.USE_D3D12}} dev_build={{.DEV_BUILD}} compiledb={{.COMPILEDB}}

  build:templates:
    desc: "Build both debug and release export templates with .NET support"
    cmds:
      - task: build:template-debug
      - task: build:template-release

  generate:glue:
    desc: "Generate C# glue sources for the Godot API"
    requires:
      vars:
        - GODOT_OUTPUT_DIR
    cmds:
      - '{{.GODOT_OUTPUT_DIR}}/godot.{{.PLATFORM}}.editor{{ if eq .DEV_BUILD "yes" }}.dev{{ end }}.{{.ARCH}}.mono.exe --headless --generate-mono-glue modules/mono/glue'

  build:dotnet-assemblies:
    desc: "Build .NET managed libraries"
    requires:
      vars:
        - GODOT_OUTPUT_DIR
    status:
      - test -d {{.GODOT_OUTPUT_DIR}}/GodotSharp
    cmds:
      - python modules/mono/build_scripts/build_assemblies.py --godot-output-dir={{.GODOT_OUTPUT_DIR}} --godot-platform={{.PLATFORM}}
    deps:
      - generate:glue

  build:editor-dotnet:
    desc: "Complete build workflow: editor + templates + glue generation + assemblies"
    cmds:
      - task: build:editor
      - task: build:dotnet-assemblies

  clean:bin:
    desc: "Remove build artifacts from bin directory"
    cmds:
      - cmd: Powershell.exe Remove-Item -Path "{{.GODOT_OUTPUT_DIR}}" -Recurse -Force

  clean:glue:
    desc: "Remove generated glue sources"
    cmds:
      - cmd: Powershell.exe Remove-Item -Path "modules/mono/glue" -Recurse -Force

  clean:dotnet-assemblies:
    desc: "Remove generated glue sources"
    cmds:
      - cmd: Powershell.exe Remove-Item -Path "{{.GODOT_OUTPUT_DIR}}/GodotSharp" -Recurse -Force

  clean:all:
    desc: "Remove untracked files and directories using Git"
    cmds:
      - git clean -fdx

  info:
    desc: "Display build information"
    cmds:
      - echo "Platform {{.PLATFORM}} Arch {{.ARCH}}"
      - echo "Godot Output Directory {{.GODOT_OUTPUT_DIR}}"
      - echo "D3D12 Support {{.USE_D3D12}}"
      - echo "Module Mono Enabled {{.MODULE_MONO_ENABLED}}"
      - echo Dotnet Version
      - dotnet --version
      - echo SCons Version
      - scons --version
